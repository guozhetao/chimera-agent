[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera-agent"
version = "0.1.0"
description = "Guideline-anchored multimodal decision agent for prostate cancer care"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CHIMERA-Agent contributors" }]
keywords = [
  "prostate cancer",
  "clinical decision support",
  "multimodal learning",
  "survival analysis",
  "guideline-anchored model",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
glm = ["zai"]

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
